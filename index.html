<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>

	<style>
		#background {
			position: fixed;
			width: 100%;
			height: 100%;
			object-fit: cover;
			top: 0;
			left: 0;
			opacity: 0.3;
			z-index: -1;
		}

		#drill {
			position: absolute;
			width: 180px;
			left: 20%;
			top: 68%;
		}

		#hammer {
			position: absolute;
			width: 140px;
			left: 46%;
			top: 70%;
		}

		#saw {
			position: absolute;
			width: 220px;
			left: 68%;
			top: 67%;
		}

		#title {
			position: absolute;
			left: 50%;
			transform: translateX(-50%);
			top: 15%;
			font-size: 80px;
			font-family: "DOSGothic";
			margin: 0;
		}

		#subtitle {
			position: absolute;
			left: 50%;
			transform: translateX(-50%);
			top: 28%;
			font-size: 20px;
			font-family: "DOSGothic";
			margin: 0;
		}
	</style>
</head>

<body>
	<img src="background.png" id="background">
	<audio src="construction.mp3" id="backgroundsnd" loop></audio>

	<h1 id="title">귀로 하는 공사</h1>
	<p id="subtitle">소음을 참아볼까요.</p>

	<img src="drill.png" id="drill">
	<audio src="drill.wav" id="drillsnd" loop></audio>

	<img src="hammer.png" id="hammer">
	<audio src="hammer.wav" id="hammersnd" loop></audio>

	<img src="saw.png" id="saw">
	<audio src="saw.wav" id="sawsnd" loop></audio>

	<script>
		document.onclick = function(){
			backgroundsnd.play();
			backgroundsnd.volume = 0.2;
		};

		let drillon = "off";

		drill.onclick = function () {
			if(drillon == "off"){
				drill.src = "drill_on.png";
				drillsnd.play();
				drillsnd.volume = 0.6;
				drillon = "on";

			}else if(drillon == "on"){
				drill.src = "drill.png";
				drillsnd.pause();
				drillon = "off";
			}
		};

		let hammeron = "off";

		hammer.onclick = function () {
			if(hammeron == "off"){
				hammer.src = "hammer_on.png";
				hammersnd.play();
				hammersnd.volume = 0.7;
				hammeron = "on";

			}else if(hammeron == "on"){
				hammer.src = "hammer.png";
				hammersnd.pause();
				hammeron = "off";
			}
		};

		let sawon = "off";

		saw.onclick = function () {
			if(sawon == "off"){
				saw.src = "saw_on.png";
				sawsnd.play();
				sawsnd.volume = 0.7;
				sawon = "on";

			}else if(sawon == "on"){
				saw.src = "saw.png";
				sawsnd.pause();
				sawon = "off";
			}
		};
	</script>

</body>
</html>
